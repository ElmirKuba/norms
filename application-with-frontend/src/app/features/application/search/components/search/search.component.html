<header class="search__header">
  <h1 class="search__header-title">Поиск</h1>
</header>

<div class="search__bar-wrap">
  <div class="search__bar">
    <svg class="search__bar-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="7" cy="7" r="5" stroke="#8E8E93" stroke-width="1.5"/>
      <path d="M11 11L14 14" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input
      class="search__bar-input"
      type="search"
      placeholder="UIN или имя"
      autocomplete="off"
      [value]="query()"
      (input)="onQueryChange($any($event.target).value)"
    />
    @if (query()) {
      <button class="search__bar-clear" type="button" (click)="onQueryChange('')" aria-label="Очистить">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2 2L12 12M12 2L2 12" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    }
  </div>
</div>

@if (results().length > 0) {
  <div class="search__results">
    @for (user of results(); track user.id) {
      <div class="search__item">
        <div class="search__avatar" [style.background]="user.avatarColor">
          <span class="search__avatar-initials">{{ user.initials }}</span>
        </div>
        <div class="search__item-info">
          <span class="search__item-name">{{ user.name }}</span>
          <span class="search__item-uin">UIN {{ user.uin }}</span>
        </div>
        <button class="search__item-action" type="button" (click)="writeToUser(user)" aria-label="Написать">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M4 18L2 22L6 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4H4C2.9 4 2 4.9 2 6V18H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    }
  </div>
} @else if (query()) {
  <div class="search__empty">
    <p class="search__empty-title">Ничего не найдено</p>
    <p class="search__empty-text">Попробуйте другой UIN или имя</p>
  </div>
} @else {
  <div class="search__empty">
    <p class="search__empty-text">Введите UIN или имя</p>
  </div>
}
