<div class="create-chat-modal">
  <div class="create-chat-modal__header">
    <div class="create-chat-modal__avatar" [style.background]="data.user.avatarColor">
      <span class="create-chat-modal__avatar-initials">{{ data.user.initials }}</span>
    </div>
    <div class="create-chat-modal__header-text">
      <p class="create-chat-modal__name">{{ data.user.name }}</p>
      <p class="create-chat-modal__hint">Выберите устройство для переписки</p>
    </div>
    <button class="create-chat-modal__close" type="button" (click)="close()" aria-label="Закрыть">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <ul class="create-chat-modal__devices">
    @for (device of data.user.devices; track device.deviceId) {
      <li>
        <button class="create-chat-modal__device" type="button" (click)="selectDevice(device)">
          <span class="create-chat-modal__device-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="5" y="2" width="14" height="20" rx="2" stroke="currentColor" stroke-width="1.8"/>
              <rect x="9" y="16" width="6" height="1.5" rx="0.75" fill="currentColor"/>
            </svg>
          </span>
          <span class="create-chat-modal__device-label">{{ device.label }}</span>
          <svg class="create-chat-modal__device-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </li>
    }
  </ul>

  <p class="create-chat-modal__note">
    Чат привязан к устройству. У одного пользователя может быть несколько устройств — каждое ведёт отдельную переписку.
  </p>
</div>
