<header class="settings-sub__header">
  <button class="settings-sub__back" type="button" (click)="goBack()" aria-label="Назад">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <h1 class="settings-sub__title">Аккаунт</h1>
</header>

<div class="settings-sub__body">
  <section class="settings-sub__section">
    <div class="settings-sub__row">
      <span class="settings-sub__row-label">Имя</span>
      <span class="settings-sub__row-value">Эльмир К.</span>
    </div>
    <div class="settings-sub__row">
      <span class="settings-sub__row-label">UIN</span>
      <span class="settings-sub__row-value settings-sub__row-value--mono">10001</span>
    </div>
    <div class="settings-sub__row">
      <span class="settings-sub__row-label">Username</span>
      <span class="settings-sub__row-value settings-sub__row-value--empty">Не назначен</span>
    </div>
  </section>

  <section class="settings-sub__section">
    <button class="settings-sub__action-row" type="button" disabled>
      <span class="settings-sub__action-label">Сменить имя</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <a class="settings-sub__action-row" routerLink="/application/main/settings/change-password">
      <span class="settings-sub__action-label">Сменить пароль</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <button class="settings-sub__action-row" type="button" disabled>
      <span class="settings-sub__action-label">Username <span class="settings-sub__action-sublabel">(назначается администратором)</span></span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </section>

  <section class="settings-sub__section">
    <button class="settings-sub__action-row settings-sub__action-row--danger" type="button" disabled>
      <span class="settings-sub__action-label">Удалить аккаунт</span>
    </button>
  </section>
</div>
