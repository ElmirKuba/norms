<header class="settings__header">
  <h1 class="settings__header-title">Настройки</h1>
</header>

<div class="settings__body">
  <section class="settings__section">
    <a class="settings__row" routerLink="/application/main/settings/account">
      <div class="settings__row-left">
        <span class="settings__row-icon settings__row-icon--blue">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
            <path d="M4 20C4 17 7.6 14 12 14C16.4 14 20 17 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="settings__row-label">Аккаунт</span>
      </div>
      <svg class="settings__row-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <a class="settings__row" routerLink="/application/main/settings/devices">
      <div class="settings__row-left">
        <span class="settings__row-icon settings__row-icon--indigo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="2" width="14" height="20" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <rect x="9" y="16" width="6" height="1.5" rx="0.75" fill="currentColor"/>
          </svg>
        </span>
        <span class="settings__row-label">Устройства</span>
      </div>
      <svg class="settings__row-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <a class="settings__row" routerLink="/application/main/settings/privacy">
      <div class="settings__row-left">
        <span class="settings__row-icon settings__row-icon--teal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L4 6V12C4 16.4 7.4 20.5 12 22C16.6 20.5 20 16.4 20 12V6L12 2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="settings__row-label">Приватность</span>
      </div>
      <svg class="settings__row-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <a class="settings__row" routerLink="/application/main/settings/invites">
      <div class="settings__row-left">
        <span class="settings__row-icon settings__row-icon--green">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M18 8H19C20.1 8 21 8.9 21 10V20C21 21.1 20.1 22 19 22H5C3.9 22 3 21.1 3 20V10C3 8.9 3.9 8 5 8H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <rect x="8" y="2" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 12V18M9 15H15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="settings__row-label">Инвайты</span>
      </div>
      <svg class="settings__row-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <a class="settings__row" routerLink="/application/main/settings/recovery">
      <div class="settings__row-left">
        <span class="settings__row-icon settings__row-icon--orange">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 22C12 22 4 18 4 12V5L12 2L20 5V12C20 18 12 22 12 22Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M9 12L11 14L15 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="settings__row-label">Восстановление доступа</span>
      </div>
      <svg class="settings__row-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </section>

  <section class="settings__section">
    <button class="settings__row settings__row--danger" type="button" disabled>
      <div class="settings__row-left">
        <span class="settings__row-icon settings__row-icon--red">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M9 21H5C4.4 21 4 20.6 4 20V4C4 3.4 4.4 3 5 3H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="settings__row-label">Выйти из аккаунта</span>
      </div>
    </button>
  </section>
</div>
