<div class="invite-success">
  <div class="invite-success__icon">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
      <path d="M20 12V22H4V12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 7H2V12H22V7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 22V7M12 7H7.5C6.1 7 5 5.9 5 4.5C5 3.1 6.1 2 7.5 2C9.5 2 12 7 12 7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 7H16.5C17.9 7 19 5.9 19 4.5C19 3.1 17.9 2 16.5 2C14.5 2 12 7 12 7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h2 class="invite-success__title">Инвайт создан</h2>

  <p class="invite-success__code">{{ data.code }}</p>
  <p class="invite-success__meta">Действует 30 дней · 1 использование</p>

  <button class="invite-success__copy-btn" type="button" (click)="copyCode()">
    @if (copied()) {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M5 12L10 17L19 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Скопировано
    } @else {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/>
        <path d="M5 15H4C2.9 15 2 14.1 2 13V4C2 2.9 2.9 2 4 2H13C14.1 2 15 2.9 15 4V5" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      Скопировать код
    }
  </button>

  <button class="invite-success__close-btn" type="button" (click)="close()">
    Готово
  </button>
</div>
