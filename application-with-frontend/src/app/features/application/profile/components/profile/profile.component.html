<header class="profile__header">
  <h1 class="profile__header-title">Профиль</h1>
  <button class="profile__header-edit" type="button" (click)="goToAccount()" aria-label="Редактировать">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M11 4H4C3.4 4 3 4.4 3 5V20C3 20.6 3.4 21 4 21H19C19.6 21 20 20.6 20 20V13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18.5 2.5C19.3 1.7 20.7 1.7 21.5 2.5C22.3 3.3 22.3 4.7 21.5 5.5L12 15L8 16L9 12L18.5 2.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
  </button>
</header>

<div class="profile__body">
  <div class="profile__card">
    <div class="profile__avatar">
      <span class="profile__avatar-initials">{{ initials() }}</span>
    </div>
    <div class="profile__info">
      <p class="profile__name">{{ displayName() }}</p>
      @if (uin().length > 0) {
        <p class="profile__uin">UIN {{ uin() }}</p>
      }
    </div>
  </div>

  <section class="profile__section">
    <div class="profile__row">
      <span class="profile__row-label">UIN</span>
      @if (uin().length > 0) {
        <span class="profile__row-value profile__row-value--mono">{{ uin() }}</span>
      } @else {
        <span class="profile__row-value profile__row-value--empty">Назначается...</span>
      }
    </div>
    @if (nickname() !== null) {
      <div class="profile__row">
        <span class="profile__row-label">Псевдоним</span>
        <span class="profile__row-value">{{ nickname() }}</span>
      </div>
    }
    @if (username() !== null) {
      <div class="profile__row">
        <span class="profile__row-label">Username</span>
        <span class="profile__row-value">@{{ username() }}</span>
      </div>
    }
  </section>

</div>
