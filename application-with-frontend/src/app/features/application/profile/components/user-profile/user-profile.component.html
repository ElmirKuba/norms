@if (user()) {
  <header class="user-profile__header">
    <button class="user-profile__back" type="button" (click)="goBack()" aria-label="Назад">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="user-profile__header-title">Профиль</h1>
  </header>

  <div class="user-profile__body">
    <div class="user-profile__card">
      <div class="user-profile__avatar" [style.background]="user()!.avatarColor">
        <span class="user-profile__avatar-initials">{{ user()!.initials }}</span>
      </div>
      <p class="user-profile__name">{{ user()!.name }}</p>
      <p class="user-profile__uin">UIN {{ user()!.uin }}</p>
    </div>

    <button class="user-profile__write-btn" type="button" (click)="writeMessage()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M4 18L2 22L6 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4H4C2.9 4 2 4.9 2 6V18H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      Написать
    </button>
  </div>
}

@if (!user()) {
  <div class="user-profile__not-found">
    <p>Пользователь не найден</p>
  </div>
}
