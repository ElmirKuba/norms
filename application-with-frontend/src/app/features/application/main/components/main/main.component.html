<div class="app-main">
  @if (passwordResetBanner()) {
    <div class="app-main__reset-banner">
      <div class="app-main__reset-banner-body">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" class="app-main__reset-banner-icon">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M12 9V13M12 17H12.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="app-main__reset-banner-text">Пароль изменён через Recovery. Если это были не вы — смените пароль.</span>
      </div>
      <div class="app-main__reset-banner-actions">
        <button class="app-main__reset-banner-btn app-main__reset-banner-btn--change" type="button" routerLink="/application/main/settings/change-password" (click)="dismissPasswordResetBanner()">
          Сменить пароль
        </button>
        <button class="app-main__reset-banner-btn app-main__reset-banner-btn--dismiss" type="button" (click)="dismissPasswordResetBanner()">
          Закрыть
        </button>
      </div>
    </div>
  }

  <main class="app-main__content">
    <router-outlet />
  </main>

  <nav class="app-main__tabbar">
    <a
      class="app-main__tab"
      [routerLink]="chatsTabLink()"
      routerLinkActive="app-main__tab--active"
      [routerLinkActiveOptions]="{ exact: false }"
      aria-label="Чаты"
    >
      <svg class="app-main__tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M4 18L2 22L6 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4H4C2.9 4 2 4.9 2 6V18H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M7 10H17M7 14H13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="app-main__tab-label">Чаты</span>
    </a>

    <a
      class="app-main__tab"
      routerLink="search"
      routerLinkActive="app-main__tab--active"
      aria-label="Поиск"
    >
      <svg class="app-main__tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
        <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="app-main__tab-label">Поиск</span>
    </a>

    <a
      class="app-main__tab"
      routerLink="settings"
      routerLinkActive="app-main__tab--active"
      aria-label="Настройки"
    >
      <svg class="app-main__tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="app-main__tab-label">Настройки</span>
    </a>

    <a
      class="app-main__tab"
      routerLink="profile"
      routerLinkActive="app-main__tab--active"
      aria-label="Профиль"
    >
      <svg class="app-main__tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 20C4 17 7.6 14 12 14C16.4 14 20 17 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="app-main__tab-label">Профиль</span>
    </a>
  </nav>
</div>
