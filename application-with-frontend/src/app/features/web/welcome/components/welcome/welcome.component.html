<div class="web-welcome">
  <div class="promo">
    <shared-badge [iconType]="badgeTypeIcons.SHIELD_SUCCESS">
      Закрытая регистрация по инвайтам
    </shared-badge>

    <h1 class="promo__title">Пространство для своих</h1>

    <p class="promo__description">Без телефона и email. Без слежки. Только те, кому доверяешь.</p>
  </div>

  <div class="download-buttons">
    @for (button of downloadButtons; track $index) {
      <button
        class="download-buttons__item"
        [ngClass]="{
          'download-buttons__item--detect': button.osType === currentOs,
        }"
      >
        <img [src]="iconSrcPath(button.osType)" />

        <div class="btn-content">
          <span class="btn-label">{{ button.label }}</span>
          <span class="btn-name">{{ button.name }}</span>
        </div>
      </button>
    }
  </div>
</div>
