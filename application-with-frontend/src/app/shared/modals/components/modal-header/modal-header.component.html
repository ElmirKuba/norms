@if (icon) {
  <div class="modal-header__icon" [class]="'modal-header__icon--' + icon">
    @switch (icon) {
      @case (modalHeaderIcon.DONE) {
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M6 14L11 19L22 8" stroke="#34C759" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      }
      @case (modalHeaderIcon.ERROR) {
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M8 8L20 20M20 8L8 20" stroke="#FF3B30" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      }
      @case (modalHeaderIcon.WARNING) {
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M14 10V15M14 19H14.01" stroke="#FF9500" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M12.3 5.3L3.3 20a2 2 0 001.7 3h18a2 2 0 001.7-3L15.7 5.3a2 2 0 00-3.4 0z" stroke="#FF9500" stroke-width="2" fill="none"/>
        </svg>
      }
      @case (modalHeaderIcon.INFO) {
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="10" stroke="#007AFF" stroke-width="2"/>
          <path d="M14 13V19M14 10H14.01" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      }
      @case (modalHeaderIcon.PRELOADER) {
        <div class="modal-header__spinner"></div>
      }
    }
  </div>
}

<h2 class="modal-header__title">
  <ng-content />
</h2>
