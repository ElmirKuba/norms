services:
  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres_norms_dev:
    container_name: postgres_norms_dev
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: norms
      POSTGRES_USER: norms
      POSTGRES_PASSWORD: norms
    volumes:
      - ./../volumes/pg_data:/var/lib/postgresql/data
      - ./../sql-files/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U norms -d norms']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis_norms_dev:
    container_name: redis_norms_dev
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./../volumes/redis_data:/data
    ports:
      - '6379:6379'

  # ── pgAdmin 4 (PostgreSQL UI) ────────────────────────────────────────────────
  pgadmin_norms_dev:
    container_name: pgadmin_norms_dev
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - ./../volumes/pgadmin_data:/var/lib/pgadmin
      - ./../pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - '8081:80'
    depends_on:
      postgres_norms_dev:
        condition: service_healthy

  # ── NestJS backend ───────────────────────────────────────────────────────────
  # По умолчанию бэк запускается на хосте: cd backend && npm run start:dev
  # Раскомментировать для полного запуска в Docker.
  # Контекст сборки — корень backend/ (два уровня выше compose-файла).
  # ─────────────────────────────────────────────────────────────────────────────
  backend_norms_dev:
    container_name: backend_norms_dev
    build:
      context: ./../../
      dockerfile: ./docker/dockerfiles/nest-backend/Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./../../.env
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      # Переопределяем localhost → имена контейнеров внутри Docker-сети
      DATABASE_URL: postgres://norms:norms@postgres_norms_dev:5432/norms
      REDIS_URL: redis://redis_norms_dev:6379
    volumes:
      - ./../../src:/backend/src:rw
    ports:
      - '3000:3000'
    depends_on:
      postgres_norms_dev:
        condition: service_healthy
      redis_norms_dev:
        condition: service_started
